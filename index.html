<script>
const URL="https://okqirqqstwvdrdezwomu.supabase.co";
const KEY="sb_publishable_n1uW2Z_nzOkvSMs5GEZo0w_0ras0N7r";
let db=null,currentUser=null,categories=[];

function msg(id,t){
 const e=document.getElementById(id);
 if(e)e.textContent=t;
}
function show(id){
 document.querySelectorAll("#auth,#add").forEach(x=>x.classList.add("hidden"));
 if(id)document.getElementById(id).classList.remove("hidden");
}
function safe(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function connect(){
 if(db)return db;
 if(!window.supabase?.createClient){
  await new Promise((resolve,reject)=>{
   const s=document.createElement("script");
   s.src="https://unpkg.com/@supabase/supabase-js@2";
   s.onload=resolve;
   s.onerror=()=>reject(new Error("تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت."));
   document.head.appendChild(s);
  });
 }
 if(!window.supabase?.createClient)throw new Error("مكتبة الاتصال غير متاحة.");
 db=window.supabase.createClient(URL,KEY);
 return db;
}
async function init(){
 try{
  msg("status","جاري الاتصال وتحميل الإعلانات...");
  await connect();
  const s=await db.auth.getSession();
  if(s.error)throw s.error;
  currentUser=s.data.session?.user||null;
  const c=await db.from("categories").select("id,name").eq("is_active",true).order("sort_order");
  if(c.error)throw c.error;
  categories=c.data||[];
  document.getElementById("category").innerHTML=categories.map(x=>`<option value="${safe(x.id)}">${safe(x.name)}</option>`).join("");
  await loadListings();
 }catch(e){
  msg("status","تعذر تشغيل التطبيق: "+e.message);
 }
}
async function signup(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){msg("authmsg","اكتب البريد وكلمة المرور.");return}
 if(password.length<6){msg("authmsg","كلمة المرور 6 أحرف على الأقل.");return}
 msg("authmsg","جاري إنشاء الحساب...");
 try{
  await connect();
  const r=await db.auth.signUp({email,password});
  if(r.error)throw r.error;
  msg("authmsg",r.data.session?"تم إنشاء الحساب بنجاح.":"تم إرسال رسالة تأكيد إلى بريدك الإلكتروني.");
 }catch(e){msg("authmsg","فشل إنشاء الحساب: "+e.message)}
}
async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){msg("authmsg","اكتب البريد وكلمة المرور.");return}
 msg("authmsg","جاري تسجيل الدخول...");
 try{
  await connect();
  const r=await db.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  currentUser=r.data.user;
  const p=await db.from("profiles").upsert(
   {id:currentUser.id,role:"customer"},
   {onConflict:"id",ignoreDuplicates:true}
  );
  if(p.error)throw p.error;
  msg("authmsg","تم تسجيل الدخول بنجاح.");
  show("");
 }catch(e){msg("authmsg","تعذر تسجيل الدخول: "+e.message)}
}
async function loadListings(){
 msg("status","جاري تحميل الإعلانات...");
 try{
  await connect();
  const q=document.getElementById("search").value.trim();
  let request=db.from("listings")
   .select("id,title,city,daily_price,description,categories(name)")
   .eq("status","published").eq("available",true)
   .order("created_at",{ascending:false});
  if(q)request=request.or(`title.ilike.%${q}%,city.ilike.%${q}%`);
  const r=await request;
  if(r.error)throw r.error;
  const items=r.data||[];
  msg("status",`عدد الإعلانات المتاحة: ${items.length}`);
  document.getElementById("listings").innerHTML=items.length?items.map(x=>`
   <article class="card">
    <div style="font-size:38px">🧰</div>
    <h3>${safe(x.title)}</h3>
    <p class="muted">${safe(x.categories?.name||"معدات")} · ${safe(x.city||"")}</p>
    <p class="price">${Number(x.daily_price).toLocaleString("ar-EG")} جنيه / يوم</p>
    <p>${safe(x.description||"")}</p>
   </article>`).join(""):"<p>لا توجد إعلانات منشورة حاليًا.</p>";
 }catch(e){
  msg("status","فشل تحميل الإعلانات: "+e.message);
 }
}
async function addListing(){
 if(!currentUser){show("auth");msg("addmsg","سجّل الدخول أولًا.");return}
 const title=document.getElementById("title").value.trim();
 const daily=Number(document.getElementById("price").value);
 if(!title||daily<=0){msg("addmsg","أدخل اسم المعدّة وسعرًا صحيحًا.");return}
 msg("addmsg","جاري إرسال الإعلان...");
 try{
  await connect();
  const r=await db.from("listings").insert({
   owner_id:currentUser.id,
   category_id:document.getElementById("category").value||null,
   title,
   city:document.getElementById("city").value.trim(),
   daily_price:daily,
   deposit:Number(document.getElementById("deposit").value)||0,
   description:document.getElementById("description").value.trim(),
   condition:"good"
  });
  if(r.error)throw r.error;
  msg("addmsg","تم إرسال إعلانك للمراجعة بنجاح.");
 }catch(e){msg("addmsg","فشل إرسال الإعلان: "+e.message)}
}
init();
</script>
